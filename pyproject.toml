[project]
name = "myspotify"
version = "0.1.0"
description = "Music recommendation system research on the Million Song Dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "scipy>=1.18.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.0",
    "gensim>=4.4.0",
    "implicit>=0.7.3",
    "optuna>=4.9.0",
    "rmm-cu13>=26.8.0",
    "nvidia-cublas>=13.6.1.10",
    "nvidia-cuda-runtime>=13.3.29",
    "nvidia-curand>=10.4.3.29",
    "dask[dataframe]>=2026.7.1",
]

[project.optional-dependencies]
word2vec = ["gensim>=4.3.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
