[project]
name = "myspotify"
version = "0.1.0"
description = "Music recommendation system research on the Million Song Dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "scikit-learn==1.9.0",
    "scipy>=1.17.1",
    "gensim>=4.4.0",
    "implicit>=0.7.3",
    "polars>=1.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "wordcloud>=1.9",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.0.0",
    "jupyterlab>=4.0.0",
    "nbconvert>=7.0.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "nbconvert>=7.17.1",
]
